# THE FLAW:
# 1. Selector mismatch: Service söker 'app: payment-api-v2', men Deployment har 'app: payment-api'.
#    Resultat: Endpoints är helt tom (<none>)!
# 2. Port mismatch: targetPort är satt till 80 istället för Spring Boots containerPort 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  labels:
    app: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api # <-- Faktisk label
    spec:
      containers:
        - name: app
          image: spring-boot-app:latest
          ports:
            - containerPort: 8080 # <-- Applikationen lyssnar här
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-api-v2 # FLAW 1: Matchar inte poddens label!
  ports:
    - name: http
      port: 80
      targetPort: 80 # FLAW 2: Skickar till 80 istället för 8080!
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-ingress
spec:
  rules:
    - host: api.vault.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 80
