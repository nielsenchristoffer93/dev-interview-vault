# Produktionskonfiguration för Spring Boot med k8s probes och separat management port
server:
  port: 8080
  shutdown: graceful # Tillåter att pågående anrop slutförs

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  server:
    port: 8081 # Isolerad port för Actuator
  endpoint:
    health:
      probes:
        enabled: true # Aktiverar /actuator/health/liveness och /readiness
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  metrics:
    export:
      prometheus:
        enabled: true
