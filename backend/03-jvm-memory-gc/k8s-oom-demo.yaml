# ==============================================================================
# 1. THE FLAW: OOMKilled (Exit Code 137) framkallas av Linux cgroups
# ==============================================================================
# JVM:ens -Xmx är satt till 128Mi men containerns cgroup limit är endast 64Mi.
# Linux-kärnan upptäcker överträdelsen och skickar SIGKILL (137).
# Podden dör utan att hinna skriva Java-stacktrace eller heap dump.
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: oomkilled-pod
  labels:
    app: oomkilled-demo
spec:
  restartPolicy: Never
  containers:
    - name: java-app
      image: jvm-memory-leak:1.0
      imagePullPolicy: IfNotPresent
      command: ["java"]
      args:
        - "-Xmx128m"  # FÖRFÄRLIG KONFIGURATION: Större än containerns gräns!
        - "-cp"
        - "/app/classes"
        - "com.vault.memory.MemoryLeakSimulation"
      resources:
        limits:
          memory: "64Mi"
        requests:
          memory: "32Mi"
---
# ==============================================================================
# 2. THE FIX: Kontrollerad OutOfMemoryError med bevarad Heap Dump
# ==============================================================================
# -XX:MaxRAMPercentage=50.0 begränsar heapen till ~64Mi (väl under K8s 128Mi limit).
# JVM hinner fånga OutOfMemoryError och dumpar minnet till en monterad volym
# innan containern avslutas. Filen kan därefter laddas ner med `kubectl cp`.
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: heapdump-pod
  labels:
    app: heapdump-demo
spec:
  restartPolicy: Never
  volumes:
    - name: dump-volume
      emptyDir: {}
  containers:
    - name: java-app
      image: jvm-memory-leak:1.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Startar JVM med begränsad heap och automatisk Heap Dump..."
          java -XX:MaxRAMPercentage=50.0 \
               -XX:+HeapDumpOnOutOfMemoryError \
               -XX:HeapDumpPath=/dumps/oom.hprof \
               -cp /app/classes \
               com.vault.memory.MemoryLeakSimulation || true

          echo "------------------------------------------------------------"
          echo "✅ OOM inträffade och dump sparades i /dumps/oom.hprof."
          echo "⏳ Håller containern vid liv så att 'kubectl cp' fungerar..."
          echo "------------------------------------------------------------"
          sleep 3600
      resources:
        limits:
          memory: "128Mi"
        requests:
          memory: "64Mi"
      volumeMounts:
        - name: dump-volume
          mountPath: /dumps
